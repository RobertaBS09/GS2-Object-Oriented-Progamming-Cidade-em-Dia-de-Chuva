<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leitura</title>
    <link rel="stylesheet" th:href="@{/css/visual.css}">
</head>
<body>

<header class="cabecalho cabecalho-cidade">
    <div class="cabecalho-conteudo">
        <a class="marca" th:href="@{/}">
            <span class="marca-icone"><span class="chuva"><i></i><i></i><i></i></span></span>
            <div>
                <h1>Cidade em Dia de Chuva</h1>
                <small>Defesa Civil · Monitoramento de calçadas</small>
            </div>
        </a>
        <nav class="menu">
            <a th:href="@{/}">Início</a>
            <a th:href="@{/bairros}">Bairros</a>
            <a th:href="@{/trechos}">Trechos</a>
            <a class="ativo" th:href="@{/leituras}">Leituras</a>
        </nav>
        <span class="monitorando">Monitorando</span>
    </div>
</header>

<main class="conteudo">
    <div class="titulo-pagina">
        <h2 th:text="${leituraDTO.id == null} ? 'Nova leitura' : 'Alterar leitura'">Leitura</h2>
    </div>

    <p class="mensagem-erro" th:if="${erro != null}" th:text="${erro}"></p>

    <form class="formulario" th:action="@{/leituras/salvar}" th:object="${leituraDTO}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="trechoId">Trecho</label>
            <select id="trechoId" th:field="*{trechoId}">
                <option value="">Selecione...</option>
                <option th:each="t : ${trechos}" th:value="${t.id}"
                        th:text="|${t.logradouro} (${t.bairroNome})|"></option>
            </select>
            <div class="erro-campo" th:if="${#fields.hasErrors('trechoId')}" th:errors="*{trechoId}"></div>
        </div>

        <div class="campo">
            <label for="dataHora">Data e hora</label>
            <input type="datetime-local" id="dataHora" th:field="*{dataHora}">
            <div class="erro-campo" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
        </div>

        <div class="campo">
            <label for="laminaCm">Lâmina (cm)</label>
            <input type="number" id="laminaCm" th:field="*{laminaCm}">
            <div class="erro-campo" th:if="${#fields.hasErrors('laminaCm')}" th:errors="*{laminaCm}"></div>
        </div>

        <div class="botoes-form">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-secundario" th:href="@{/leituras}">Cancelar</a>
        </div>
    </form>
</main>

<footer class="rodape">Cidade em Dia de Chuva · Global Solution 2026.2 · FIAP</footer>

</body>
</html>
