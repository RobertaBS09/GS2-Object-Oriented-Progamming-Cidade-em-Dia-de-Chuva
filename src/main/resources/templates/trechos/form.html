<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trecho</title>
    <link rel="stylesheet" th:href="@{/css/visual.css}">
</head>
<body>

<header class="cabecalho cabecalho-cidade">
    <div class="cabecalho-conteudo">
        <a class="marca" th:href="@{/}">
            <span class="marca-icone"><span class="chuva"><i></i><i></i><i></i></span></span>
            <div>
                <h1>Cidade em Dia de Chuva</h1>
                <small>Defesa Civil · Monitoramento de calçadas</small>
            </div>
        </a>
        <nav class="menu">
            <a th:href="@{/}">Início</a>
            <a th:href="@{/bairros}">Bairros</a>
            <a class="ativo" th:href="@{/trechos}">Trechos</a>
            <a th:href="@{/leituras}">Leituras</a>
        </nav>
        <span class="monitorando">Monitorando</span>
    </div>
</header>

<main class="conteudo">
    <div class="titulo-pagina">
        <h2 th:text="${trechoDTO.id == null} ? 'Novo trecho' : 'Alterar trecho'">Trecho</h2>
    </div>

    <p class="mensagem-erro" th:if="${erro != null}" th:text="${erro}"></p>

    <form class="formulario" th:action="@{/trechos/salvar}" th:object="${trechoDTO}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" th:field="*{logradouro}">
            <div class="erro-campo" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
        </div>

        <div class="campo">
            <label for="bairroId">Bairro</label>
            <select id="bairroId" th:field="*{bairroId}">
                <option value="">Selecione...</option>
                <option th:each="b : ${bairros}" th:value="${b.id}" th:text="${b.nome}"></option>
            </select>
            <div class="erro-campo" th:if="${#fields.hasErrors('bairroId')}" th:errors="*{bairroId}"></div>
        </div>

        <div class="campo">
            <label for="tipoCalcada">Tipo de calçada</label>
            <select id="tipoCalcada" th:field="*{tipoCalcada}">
                <option value="">Selecione...</option>
                <option th:each="tc : ${tiposCalcada}" th:value="${tc}" th:text="${tc}"></option>
            </select>
            <div class="erro-campo" th:if="${#fields.hasErrors('tipoCalcada')}" th:errors="*{tipoCalcada}"></div>
        </div>

        <div class="campo">
            <label for="altitude">Altitude (m)</label>
            <input type="number" id="altitude" th:field="*{altitude}">
            <div class="erro-campo" th:if="${#fields.hasErrors('altitude')}" th:errors="*{altitude}"></div>
        </div>

        <div class="botoes-form">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-secundario" th:href="@{/trechos}">Cancelar</a>
        </div>
    </form>
</main>

<footer class="rodape">Cidade em Dia de Chuva · Global Solution 2026.2 · FIAP</footer>

</body>
</html>
